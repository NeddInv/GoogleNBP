
<!DOCTYPE html>

  <head>
    <script>
      // Provide both getter and setter for window.fetch so iframe host harnesses and extensions
      // can wrap fetch without triggering 'Cannot set property fetch of #<Window> which has only a getter'
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('fetch of #<Window>') !== -1) {
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
